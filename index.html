<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { background-color: #0F172A; color: #F8FAFC; font-family: sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    #qrcode img { margin: auto; padding: 12px; background: white; border-radius: 12px; }
  </style>
</head>
<body class="p-4 flex flex-col justify-between min-h-screen">

  <!-- Header -->
  <header class="text-center my-4">
    <h1 class="text-2xl font-bold text-indigo-400">QR Code Studio</h1>
    <p class="text-xs text-gray-400">ফাষ্ট ও প্রিমিয়াম জেনারেটর</p>
  </header>

  <!-- Main Card -->
  <main class="glass-card p-6 rounded-2xl shadow-2xl max-w-sm mx-auto w-full">
    
    <!-- Input Section -->
    <div class="mb-4">
      <label class="block text-xs font-semibold mb-2 text-gray-300">লিংক বা টেক্সট লিখুন:</label>
      <input type="text" id="qr-input" placeholder="https://example.com" 
        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-sm">
    </div>

    <!-- Action Button -->
    <button onclick="generateQR()" 
      class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-500/30">
      QR কোড তৈরি করুন
    </button>

    <!-- QR Output Display Area -->
    <div id="qr-container" class="mt-6 text-center hidden">
      <div id="qrcode" class="inline-block shadow-inner"></div>
      <p class="text-xs text-gray-400 mt-2">আপনার QR কোড রেডি!</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 py-4">
    Fast & Offline QR Utility
  </footer>

  <script>
    let qr;
    function generateQR() {
      const input = document.getElementById("qr-input").value;
      const container = document.getElementById("qr-container");
      const qrDiv = document.getElementById("qrcode");

      if (!input.trim()) return;

      qrDiv.innerHTML = ""; // Clear previous QR
      container.classList.remove("hidden");

      qr = new QRCode(qrDiv, {
        text: input,
        width: 180,
        height: 180,
        colorDark : "#0F172A",
        colorLight : "#FFFFFF",
        correctLevel : QRCode.CorrectLevel.H
      });
    }
  </script>
</body>
</html>
