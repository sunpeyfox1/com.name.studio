<!DOCTYPE html>
<html lang="bn">
<head>
  <link rel="manifest" href="manifest.json">
  <metaharset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funny Soundboard Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0F172A; color: #F8FAFC; font-family: sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .sound-btn:active { transform: scale(0.95); background-color: #4F46E5 !important; }
    .page { display: none; }
    .page.active { display: flex; }
  </style>
</head>
<body class="p-4 min-h-screen flex flex-col justify-between max-w-md mx-auto"> 

  <!-- 1. Welcome Screen -->
  <div id="welcome-page" class="page active flex-col items-center justify-center h-[85vh] text-center gap-6">
    <div class="w-24 h-24 bg-indigo-600/20 border border-indigo-500/40 rounded-3xl flex items-center justify-center shadow-2xl animate-bounce">
      <span class="text-5xl">🎧</span>
    </div>
    <div>
      <h1 class="text-3xl font-extrabold text-indigo-400 mb-2">Funny Soundboard</h1>
      <p class="text-xs text-gray-400 px-6">সবচেয়ে মজার সাউন্ড ইফেক্ট নিয়ে তৈরি প্রিমিয়াম সাউন্ড প্যাড!</p>
    </div>
    <button onclick="enterApp()" class="w-full max-w-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-500/30 text-sm transition">
      🚀 অ্যাপে প্রবেশ করুন
    </button>
  </div> 

  <!-- 2. Main Soundboard Screen -->
  <div id="main-page" class="page flex-col justify-between h-[92vh]">
    
    <!-- Header -->
    <header class="text-center my-2 flex items-center justify-between bg-slate-800/50 p-3 rounded-2xl border border-slate-700/50">
      <h1 class="text-lg font-bold text-indigo-400">Funny Soundboard</h1>
      <button onclick="goHome()" class="text-xs bg-slate-700 px-3 py-1.5 rounded-xl hover:bg-slate-600">হোম</button>
    </header> 

    <!-- Search Section -->
    <div class="my-2">
      <div class="flex gap-2">
        <input type="text" id="searchInput" placeholder="অনলাইনে সাউন্ড খুঁজুন..." 
               class="w-full p-2.5 rounded-xl bg-slate-800 text-white text-xs border border-slate-700 focus:outline-none focus:border-indigo-500">
        <button onclick="searchOnlineSounds()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shrink-0">
          সার্চ
        </button>
      </div>
      <div id="searchResults" class="mt-2 flex flex-col gap-2 max-h-36 overflow-y-auto"></div>
    </div>

    <!-- Sound Grid with Scroll -->
    <main class="grid grid-cols-2 gap-3 my-2 overflow-y-auto max-h-[50vh] p-1">
      <button onclick="playSound('https://www.myinstants.com/media/sounds/brrruh.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">💀</span>
        <span class="text-xs font-semibold text-gray-200">Bruh</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/mlg-airhorn.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">📢</span>
        <span class="text-xs font-semibold text-gray-200">Air Horn</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/troll-laugh.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">😂</span>
        <span class="text-xs font-semibold text-gray-200">Troll Laugh</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/sad-trombone.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">❌</span>
        <span class="text-xs font-semibold text-gray-200">Sad Trombone</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/pop_1.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">🎈</span>
        <span class="text-xs font-semibold text-gray-200">Pop Sound</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/applause.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">👏</span>
        <span class="text-xs font-semibold text-gray-200">Clapping</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/rimshot.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">🥁</span>
        <span class="text-xs font-semibold text-gray-200">Ba Dum Tss</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/correct-ding_2.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">🔔</span>
        <span class="text-xs font-semibold text-gray-200">Correct Ding</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/laser_1.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">🔫</span>
        <span class="text-xs font-semibold text-gray-200">Laser Gun</span>
      </button>
      <button onclick="playSound('https://www.myinstants.com/media/sounds/epic-fail-sound-effect.mp3')" class="sound-btn glass-card p-4 rounded-2xl text-center shadow-lg transition duration-150 flex flex-col items-center gap-2 hover:border-indigo-500">
        <span class="text-2xl">🔥</span>
        <span class="text-xs font-semibold text-gray-200">Epic Fail</span>
      </button>
    </main> 

  </div> 

  <!-- Hidden Ad Space -->
  <footer class="mt-auto pt-2">
    <div id="ad-container" class="w-full h-12 bg-transparent rounded-xl flex items-center justify-center">
      <!-- AdMob banner will inject here -->
    </div>
  </footer> 

  <script>
    // ১. সাধারণ সাউন্ড প্লে করার নিরাপদ ফাংশন
    let currentAudio = null;
    function playSound(soundUrl) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = new Audio(soundUrl);
      currentAudio.play().catch(error => console.log("অডিও প্লে করতে সমস্যা হয়েছে:", error));
    }

    // ২. অনলাইন সাউন্ড সার্ভার থেকে ফাইল খোঁজার ফাংশন
    async function searchOnlineSounds() {
      const query = document.getElementById('searchInput').value.trim();
      const resultsContainer = document.getElementById('searchResults');
      
      if (!query) return; 

      resultsContainer.innerHTML = '<p class="text-center text-xs text-gray-400">খুঁজছে...</p>'; 

      try {
        const response = await fetch(`https://freesound.org/apiv2/search/text/?query=${encodeURIComponent(query)}&token=4Wws4IugCiGk8lgZTh2KohRxoIfSZ47vb3HgKSr3&fields=id,name,previews`);
        const data = await response.json(); 

        resultsContainer.innerHTML = ''; 

        if (!data.results || data.results.length === 0) {
          resultsContainer.innerHTML = '<p class="text-center text-xs text-gray-400">কোনো সাউন্ড পাওয়া যায়নি!</p>';
          return;
        } 

        data.results.slice(0, 5).forEach(sound => {
          const soundUrl = sound.previews['preview-hq-mp3'];
          
          const card = document.createElement('div');
          card.className = "bg-slate-800 p-2.5 rounded-xl flex justify-between items-center border border-slate-700";
          card.innerHTML = `
            <span class="text-xs font-semibold text-gray-200 truncate w-1/2">${sound.name}</span>
            <div class="flex gap-2 shrink-0">
              <button onclick="playSound('${soundUrl}')" class="bg-green-600 hover:bg-green-500 text-white px-2.5 py-1 rounded-lg text-xs font-bold">
                ▶ শুনুন
              </button>
              <button onclick="downloadSoundWithAd('${soundUrl}', '${sound.name.replace(/'/g, "")}')" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded-lg text-xs font-bold">
                ⬇ ডাউনলোড
              </button>
            </div>
          `;
          resultsContainer.appendChild(card);
        });
      } catch (error) {
        resultsContainer.innerHTML = '<p class="text-center text-xs text-red-400">সার্ভার কানেকশন ত্রুটি!</p>';
      }
    } 

    // ৩. সুরক্ষিত ডাউনলোড ফাংশন
    function downloadSoundWithAd(url, fileName) {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ৪. পেজ নেভিগেশন
    function enterApp() {
      document.getElementById('welcome-page').classList.remove('active');
      document.getElementById('main-page').classList.add('active');
    } 

    function goHome() {
      document.getElementById('main-page').classList.remove('active');
      document.getElementById('welcome-page').classList.active ? null : document.getElementById('welcome-page').classList.add('active');
    }
  </script>
</body>
</html>
